# Aurora Swarm BTC - Worker Plane (single-machine friendly)
# Uses host networking so REDIS_URL=redis://127.0.0.1:6379/0 works.
#
# Usage:
#   docker compose -f docker-compose.worker.yml up -d --build
#   docker compose -f docker-compose.worker.yml logs -f
#   docker compose -f docker-compose.worker.yml down

services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: aurora-worker
    network_mode: host
    environment:
      - REDIS_URL=${REDIS_URL:-redis://127.0.0.1:6379/0}
      - WORKER_NAME=${WORKER_NAME:-aurora-gpu1}
      - GPUS_PER_POD=${GPUS_PER_POD:-1}
      - INTENSITY=${INTENSITY:-19}
      - MINING_WALLET=${MINING_WALLET}
      - POOL_URL=${POOL_URL:-stratum+tcp://stratum.braiins.com:3333}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
