# Aurora Swarm BTC - Worker (single-machine)
#
# 1) Redis must be up:  docker compose up -d redis
# 2) Install bfgminer on the HOST (Arch: yay -S bfgminer)
# 3) Set MINING_WALLET in .env
# 4) docker compose -f docker-compose.worker.yml up -d --build
#
# Host networking so REDIS_URL=redis://127.0.0.1:6379/0 works.
# Host bfgminer binary is mounted into the container.

services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: aurora-worker
    network_mode: host
    environment:
      - REDIS_URL=${REDIS_URL:-redis://127.0.0.1:6379/0}
      - WORKER_NAME=${WORKER_NAME:-aurora-gpu1}
      - GPUS_PER_POD=${GPUS_PER_POD:-1}
      - INTENSITY=${INTENSITY:-19}
      - MINING_WALLET=${MINING_WALLET}
      - POOL_URL=${POOL_URL:-stratum+tcp://stratum.braiins.com:3333}
      - PYTHONUNBUFFERED=1
      - PATH=/host-bin:/usr/local/bin:/usr/bin:/bin
    volumes:
      # Mount host miner binary (adjust path if `which bfgminer` differs)
      - ${BFGMINER_PATH:-/usr/bin/bfgminer}:/host-bin/bfgminer:ro
    restart: unless-stopped
