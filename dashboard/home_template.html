<!DOCTYPE html>
<html><head><title>Aurora Swarm</title>
<style>
body{font-family:system-ui,sans-serif;background:#0a0a0a;color:#0f0;margin:40px}
h1,h2{color:#0f0;margin-top:0}
.card{background:#111;border:1px solid #0f0;padding:20px;margin:20px 0;border-radius:8px}
pre{background:#000;padding:15px;overflow-x:auto;font-size:.85em}
.metric{font-size:2em;font-weight:bold}
button{background:#003300;color:#0f0;border:1px solid #0f0;padding:7px 14px;margin:3px;cursor:pointer;border-radius:4px}
button.small{padding:4px 8px;font-size:.85em}
input,select{background:#000;color:#0f0;border:1px solid #0f0;padding:6px;margin:2px;border-radius:4px}
.muted{color:#6a6}.mono{font-family:ui-monospace,monospace}.success{color:#0f0}.error{color:#f66}
a{color:#0f0}
#shared_window_status{padding:12px;border:1px solid #0f0;border-radius:6px;margin:10px 0;line-height:1.5}
</style></head><body>
<h1>Aurora Swarm</h1>

<div class="card">
<h2>Shared window</h2>
<div id="shared_window_status" class="muted">Checking mesh…</div>
<div id="comms_card" class="muted"></div>
<button type="button" onclick="connectSharedWindow()">Connect shared window</button>
<details style="margin-top:12px">
<summary class="muted">Manual only if auto fails</summary>
<button type="button" class="small" onclick="commsExport()">Show join env</button>
<a href="/comms/export.sh" download="join-aurora-mesh.sh"><button type="button" class="small">Download join.sh</button></a>
<pre id="comms_export" class="mono muted" style="max-height:80px;overflow:auto;white-space:pre-wrap"></pre>
</details>
<div id="comms_result" style="min-height:18px;margin-top:8px"></div>

<h2 style="margin-top:18px">Chat</h2>
<div style="display:flex;gap:12px;flex-wrap:wrap">
<div style="min-width:160px;flex:0 0 180px">
<div id="chat_users" class="muted" style="max-height:200px;overflow:auto;border:1px solid #0f0;border-radius:6px;padding:6px">…</div>
</div>
<div style="flex:1;min-width:220px">
<div id="chat_title" class="muted">#swarm</div>
<div id="chat_log" style="min-height:200px;max-height:300px;overflow:auto;border:1px solid #0f0;border-radius:6px;padding:8px;background:#0b0b0b"></div>
<div style="margin-top:8px;display:flex;gap:6px">
<input id="chat_text" placeholder="Message…" style="flex:1">
<button type="button" onclick="chatSend()">Send</button>
</div>
</div>
</div>
</div>

<div class="card"><h2>Mining</h2>
<button type="button" onclick="startLocalMine()">Start mining</button>
<button type="button" onclick="stopLocalMine()">Stop mining</button>
<button type="button" onclick="registerIdentity()">Register identity</button>
<details style="margin-top:8px"><summary class="muted">Advanced</summary>
<button type="button" class="small" onclick="runSelftest()">Self-test (quiet)</button>
<div id="selftest_box" class="muted" style="margin-top:6px"></div>
</details>
<div id="torrent_msg" style="margin-top:8px"></div>
</div>

<div class="card"><h2>Status</h2>
<div id="status">…</div>
<div id="global_stats" class="muted"></div>
<div id="bvl_status" class="muted"></div>
<div id="identity_status" class="muted"></div>
</div>

<div class="card"><h2>Node commands</h2>
<select id="ncc_node" onchange="nccLoad()"><option value="">— node —</option></select>
<button type="button" class="small" onclick="nccRefreshNodes()">Refresh</button>
<div id="ncc_detail" class="muted">—</div>
<button type="button" onclick="nccCmd('pause')">Pause</button>
<button type="button" onclick="nccCmd('resume')">Resume</button>
<button type="button" onclick="nccCmd('bvl_balance')">BVL</button>
<div id="ncc_result"></div>
</div>

<div class="card"><h2>Assets</h2>
<input type="file" id="torrent_file">
<button type="button" onclick="uploadTorrent()">Upload</button>
</div>

<div class="card"><h2>Nodes</h2><pre id="nodes"></pre></div>

<script src="/ux/comms.js"></script>
<script>
function fetchTimeout(url, ms, opts){
  ms = ms || 8000;
  var c = new AbortController();
  var t = setTimeout(function(){ c.abort(); }, ms);
  return fetch(url, Object.assign({}, opts||{}, {signal: c.signal})).finally(function(){ clearTimeout(t); });
}
document.getElementById('chat_text').addEventListener('keydown', function(e){ if(e.key==='Enter') chatSend(); });
function showT(m,ok){ var e=document.getElementById('torrent_msg'); if(e){ e.textContent=m; e.className=ok?'success':'error'; } }

async function refresh(){
  try{
    var s = await fetchTimeout('/status', 8000).then(function(r){ return r.json(); });
    var rate = s.hashrate_display || (s.mining && s.mining.hashrate_display) || 'idle';
    if(rate==='0 H/s' || rate==='0.0 GH/s') rate = (s.mining && s.mining.running) ? 'warming up…' : 'idle';
    var m = s.mining || {};
    document.getElementById('status').innerHTML =
      '<div class="metric">'+(s.active_workers||0)+' workers</div>'+
      '<p><strong>'+rate+'</strong> · '+(s.mood||'')+'</p>'+
      '<p class="muted">'+(m.hashrate_display||'idle')+(m.running?' · running':' · stopped')+'</p>';
    try{
      var g = await fetchTimeout('/comms/global', 6000).then(function(r){ return r.json(); });
      var b = g.bvl || {};
      document.getElementById('global_stats').innerHTML =
        'Global <strong>'+(g.global_hashrate_display||'idle')+'</strong> · peers '+(g.peer_count||0)+
        ' · BVL supply '+(b.supply||0);
      document.getElementById('bvl_status').textContent = 'BVL '+(b.balance||0);
      if(g.identity) document.getElementById('identity_status').textContent = 'fp '+(g.identity.fingerprint||'');
    }catch(e){}
    try{
      document.getElementById('nodes').innerText = JSON.stringify(await fetchTimeout('/nodes',6000).then(function(r){return r.json();}), null, 2);
    }catch(e){}
    if(typeof nccRefreshNodes==='function') nccRefreshNodes();
  }catch(e){
    document.getElementById('status').innerHTML = '<span class="error">Status unreachable</span>';
  }
}
async function startLocalMine(){
  try{
    var d=await fetchTimeout('/mining/engine/start',20000,{method:'POST'}).then(function(r){return r.json();});
    showT(d.ok?('Mining '+(d.hashrate_display||'on')):(d.error||'fail'), !!d.ok); refresh();
  }catch(e){ showT('timeout', false); }
}
async function stopLocalMine(){
  try{ await fetchTimeout('/mining/engine/stop',10000,{method:'POST'}); showT('stopped', true); refresh(); }catch(e){}
}
async function nccRefreshNodes(){
  try{
    var d=await fetchTimeout('/comms/chat/users',6000).then(function(r){return r.json();});
    var sel=document.getElementById('ncc_node'); var cur=sel.value;
    sel.innerHTML='<option value="">— node —</option>';
    (d.users||[]).forEach(function(u){
      if(u.source==='self') return;
      var o=document.createElement('option'); o.value=u.node_id; o.textContent=(u.online?'● ':'○ ')+u.node_id; sel.appendChild(o);
    });
    if(cur) sel.value=cur;
  }catch(e){}
}
async function nccLoad(){
  var id=document.getElementById('ncc_node').value; if(!id) return;
  try{
    var d=await fetchTimeout('/comms/node/'+encodeURIComponent(id),6000).then(function(r){return r.json();});
    document.getElementById('ncc_detail').textContent=id+' · '+(d.online?'online':'offline')+' · BVL '+d.bvl_balance;
  }catch(e){}
}
async function nccCmd(action){
  var id=document.getElementById('ncc_node').value; if(!id) return;
  var fd=new FormData(); fd.append('action',action);
  try{
    var d=await fetchTimeout('/comms/node/'+encodeURIComponent(id)+'/command',10000,{method:'POST',body:fd}).then(function(r){return r.json();});
    document.getElementById('ncc_result').textContent=d.ok?(action+' ok'):(d.error||'fail');
  }catch(e){}
}
async function uploadTorrent(){
  var f=document.getElementById('torrent_file').files[0]; if(!f) return;
  var fd=new FormData(); fd.append('file',f);
  try{
    var data=await fetchTimeout('/torrent/upload',30000,{method:'POST',body:fd}).then(function(r){return r.json();});
    showT(data.status==='ok'?'Seeded':'fail', data.status==='ok');
  }catch(e){ showT('timeout', false); }
}
async function registerIdentity(){
  try{
    var d=await fetchTimeout('/btc/identity/register',10000,{method:'POST'}).then(function(r){return r.json();});
    if(d.status!=='ok') d=await fetchTimeout('/btc/identity/register_safe',10000,{method:'POST'}).then(function(r){return r.json();});
    showT(d.status==='ok'?'Identity ok':'fail', d.status==='ok'); refresh();
  }catch(e){}
}
async function runSelftest(){
  var box=document.getElementById('selftest_box'); if(box) box.textContent='…';
  try{
    var d=await fetchTimeout('/ops/selftest',20000).then(function(r){return r.json();});
    var h=d.ok?'<span class="success">All ok</span>':'<span class="error">Issues</span>';
    (d.results||[]).forEach(function(r){ h+='<div>'+(r.ok?'✓':'✗')+' '+r.name+'</div>'; });
    if(box) box.innerHTML=h;
  }catch(e){ if(box) box.textContent='timeout'; }
}
refresh(); setInterval(refresh, 4000);
</script>
</body></html>
