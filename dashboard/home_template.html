<!DOCTYPE html>
<html><head><title>Aurora Swarm</title>
<style>
body{font-family:system-ui,sans-serif;background:#0a0a0a;color:#0f0;margin:40px}
h1,h2{color:#0f0;margin-top:0}
.card{background:#111;border:1px solid #0f0;padding:20px;margin:20px 0;border-radius:8px}
.metric{font-size:1.6em;font-weight:bold}
button{background:#003300;color:#0f0;border:1px solid #0f0;padding:10px 18px;margin:4px;cursor:pointer;border-radius:4px;font-size:1em}
.muted{color:#6a6}.success{color:#0f0}.error{color:#f66}
#mine_status{padding:14px;border:1px solid #0f0;border-radius:6px;margin:10px 0}
</style></head><body>
<h1>Aurora Swarm</h1>

<div class="card">
<h2>Mining</h2>
<div id="mine_status" class="muted">…</div>
<button type="button" id="btn_start" onclick="doStart()">Start mining</button>
<button type="button" id="btn_stop" onclick="doStop()">Stop mining</button>
<div id="mine_msg" class="muted" style="margin-top:8px"></div>
</div>

<div class="card">
<h2>Status</h2>
<div id="status">…</div>
</div>

<div class="card">
<h2>Shared window</h2>
<div id="shared_window_status" class="muted">Mesh loads after mining is healthy</div>
<button type="button" onclick="connectSharedWindow()">Connect shared window</button>
<div id="chat_log" style="min-height:120px;border:1px solid #0f0;border-radius:6px;padding:8px;margin-top:8px"></div>
<div style="margin-top:8px;display:flex;gap:6px">
<input id="chat_text" placeholder="Message…" style="flex:1;background:#000;color:#0f0;border:1px solid #0f0;padding:6px">
<button type="button" onclick="chatSend()">Send</button>
</div>
</div>

<script>
function msg(t, ok){
  var e=document.getElementById('mine_msg');
  e.textContent=t; e.className=ok?'success':'error';
}
async function jfetch(url, opts, ms){
  ms = ms || 4000;
  var c = new AbortController();
  var t = setTimeout(function(){ c.abort(); }, ms);
  try{
    var r = await fetch(url, Object.assign({}, opts||{}, {signal: c.signal}));
    return await r.json();
  } finally { clearTimeout(t); }
}
async function refreshMine(){
  var box=document.getElementById('mine_status');
  try{
    var d=await jfetch('/mining/engine/status', {}, 3000);
    var run=!!d.running;
    var rate=d.hashrate_display||(run?'warming up…':'idle');
    box.className=run?'success':'muted';
    box.innerHTML='<div class="metric">'+(run?'RUNNING':'STOPPED')+' · '+rate+'</div>'
      +'<div class="muted">'+(d.backend||'')+' · '+(d.pool||'')+'</div>'
      +(d.error?('<div class="error">'+d.error+'</div>'):'');
    document.getElementById('status').innerHTML=box.innerHTML;
  }catch(e){
    box.className='error';
    box.textContent='Cannot reach /mining/engine/status — is the container up? Try: docker compose ps';
  }
}
async function doStart(){
  msg('Starting…', true);
  document.getElementById('btn_start').disabled=true;
  try{
    var d=await jfetch('/mining/engine/start',{method:'POST'}, 5000);
    msg(d.ok?'Started — hashing in background':(d.error||'failed'), !!d.ok);
  }catch(e){
    msg('Start failed to reach server', false);
  }
  document.getElementById('btn_start').disabled=false;
  refreshMine();
}
async function doStop(){
  msg('Stopping…', true);
  try{
    await jfetch('/mining/engine/stop',{method:'POST'}, 5000);
    msg('Stopped', true);
  }catch(e){
    msg('Stop failed to reach server', false);
  }
  refreshMine();
}
async function connectSharedWindow(){
  try{
    await jfetch('/comms/join_mesh',{method:'POST',body:new FormData()},8000);
  }catch(e){}
}
async function chatSend(){
  var input=document.getElementById('chat_text');
  var text=(input.value||'').trim(); if(!text) return;
  try{
    await jfetch('/comms/chat/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text,room:'swarm'})},5000);
    input.value='';
  }catch(e){}
}
refreshMine();
setInterval(refreshMine, 2000);
</script>
</body></html>
