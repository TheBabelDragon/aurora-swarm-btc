# Solo: Redis + Dashboard — mining auto-starts (no curl)
services:
  redis:
    image: redis:7-alpine
    container_name: aurora-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - aurora-net

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: aurora-dashboard
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
      - AURORA_NODE_ID=dashboard
      - AURORA_AUTO_MINE=1
      - AURORA_MINER_BACKEND=${AURORA_MINER_BACKEND:-auto}
      - MINING_WALLET=${MINING_WALLET:-bc1qdpqzuem4dkamt8ckcwaul7a2rhqju30xwn3f5g}
      - POOL_URL=${POOL_URL:-stratum+tcp://stratum.braiins.com:3333}
      - INTENSITY=${INTENSITY:-19}
      - GPUS_PER_POD=${GPUS_PER_POD:-1}
      - BFGMINER_BIN=${BFGMINER_BIN:-/host-bin/bfgminer}
      - WORKER_NAME=${WORKER_NAME:-dashboard}
    volumes:
      - ${BFGMINER_PATH:-/usr/bin/bfgminer}:/host-bin/bfgminer:ro
    restart: unless-stopped
    networks:
      - aurora-net

networks:
  aurora-net:
    driver: bridge

volumes:
  redis_data:
