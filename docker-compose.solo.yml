# Host network — Redis + discovery + persistent node key
services:
  redis:
    image: redis:7-alpine
    container_name: aurora-redis
    network_mode: host
    command:
      [
        "redis-server",
        "--bind",
        "0.0.0.0",
        "--protected-mode",
        "no",
        "--appendonly",
        "yes",
        "--save",
        "60",
        "1",
      ]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: aurora-dashboard
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=${REDIS_URL:-redis://127.0.0.1:6379/0}
      - PYTHONUNBUFFERED=1
      - AURORA_NODE_ID=${AURORA_NODE_ID:-}
      - AURORA_NODE_KEY_PATH=/data/aurora_node_key.json
      # Default off — you press Start when ready
      - AURORA_AUTO_MINE=${AURORA_AUTO_MINE:-0}
      - AURORA_MINER_BACKEND=${AURORA_MINER_BACKEND:-cpu}
      - AURORA_CPU_THREADS=${AURORA_CPU_THREADS:-0}
      - AURORA_CPU_OVERSUBSCRIBE=${AURORA_CPU_OVERSUBSCRIBE:-3}
      - AURORA_DISCOVERY=${AURORA_DISCOVERY:-1}
      - AURORA_DISCOVERY_PORT=${AURORA_DISCOVERY_PORT:-7379}
      - MINING_WALLET=${MINING_WALLET:-bc1qdpqzuem4dkamt8ckcwaul7a2rhqju30xwn3f5g}
      - POOL_URL=${POOL_URL:-stratum+tcp://stratum.braiins.com:3333}
      - INTENSITY=${INTENSITY:-22}
      - WORKER_NAME=${WORKER_NAME:-}
    volumes:
      - node_key:/data
    restart: unless-stopped

volumes:
  redis_data:
  node_key:
