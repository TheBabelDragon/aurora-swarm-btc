apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aurora-worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aurora-worker
  minReplicas: {{ .Values.autoscaling.minWorkers }}
  maxReplicas: {{ .Values.autoscaling.maxWorkers }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70