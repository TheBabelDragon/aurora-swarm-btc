replicaCount: 1

mining:
  wallet: "bc1qdpqzuem4dkamt8ckcwaul7a2rhqju30xwn3f5g"
  poolUrl: "stratum+tcp://stratum.braiins.com:3333"
  workerName: "aurora-gpu"
  intensity: "19"
  gpusPerPod: 1

image:
  repository: yourusername/aurora-worker
  tag: "latest"
  pullPolicy: IfNotPresent

resources:
  limits:
    nvidia.com/gpu: "{{ .Values.mining.gpusPerPod }}"   # Dynamic
  requests:
    cpu: "1000m"
    memory: "2Gi"
    nvidia.com/gpu: "{{ .Values.mining.gpusPerPod }}"

tolerations:
  - key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"

nodeSelector:
  accelerator: nvidia

prometheus:
  enabled: true
  port: 8000

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 16
  targetCPUUtilizationPercentage: 70