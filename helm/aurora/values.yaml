replicaCount: 2

image:
  worker: ghcr.io/TheBabelDragon/aurora-btc-worker:latest
  scheduler: ghcr.io/TheBabelDragon/aurora-btc-scheduler:latest
  dashboard: ghcr.io/TheBabelDragon/aurora-dashboard:latest

gpu:
  enabled: true
  limit: 1

mining:
  coin: "BTC"
  pool: "stratum+tcp://btc.viabtc.com:3333"
  wallet: "YOUR_BTC_WALLET_HERE"
  workerPrefix: "aurora"
  extraArgs: "--apiport 8080 --intensity 6"

autoscaling:
  minWorkers: 2
  maxWorkers: 32